    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved covers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p notion-studio/photo-covers
          curl -fL --retry 3 --retry-all-errors "$CONTROL_URL" -o notion-studio/photo-covers/control.jpg
          curl -fL --retry 3 --retry-all-errors "$PRIVATE_URL" -o notion-studio/photo-covers/private.jpg
          curl -fL --retry 3 --retry-all-errors "$ROADMAP_URL" -o notion-studio/photo-covers/roadmap.jpg
          curl -fL --retry 3 --retry-all-errors "$QA_URL" -o notion-studio/photo-covers/qa.jpg
          curl -fL --retry 3 --retry-all-errors "$WEBSITE_URL" -o notion-studio/photo-covers/website.jpg
          curl -fL --retry 3 --retry-all-errors "$TEACHER_URL" -o notion-studio/photo-covers/teacher.jpg
          curl -fL --retry 3 --retry-all-errors "$PKM_URL" -o notion-studio/photo-covers/pkm.jpg
          file notion-studio/photo-covers/*.jpg

      - name: Commit stable cover assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion-studio/photo-covers/*.jpg
          if git diff --cached --quiet; then
            echo "No new cover files to commit."
          else
            git commit -m "Add approved photorealistic Notion cover assets"
            git push
          fi
